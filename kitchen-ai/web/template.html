<title>Kitchen AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, bottom tab bar, pinned action bar on task screens.
   Same design system as the iPhone app: warm whites, ink-black buttons, one tomato accent for protein. */
:root {
  --bg: #FFFFFF; --surface: #F6F5F2; --surface-2: #EEECE7; --line: #E6E4DF;
  --ink: #121212; --ink-soft: #5E5B57; --ink-faint: #85827D; --on-ink: #FFFFFF;
  --accent: #F04E23; --accent-soft: #FDECE6; --accent-ink: #B8320F; --on-accent: #FFFFFF;
  --ok: #12804A; --ok-soft: #E5F4EC; --warn: #9A5B00; --warn-soft: #FFF3DC; --danger: #C62A1E; --danger-soft: #FDE8E6;
  --hero: #121212; --hero-fg: #FFFFFF; --hero-soft: #C9C6C0;
  --shadow: 0 6px 18px rgba(18,18,18,.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121110; --surface: #1C1B19; --surface-2: #262421; --line: #2F2D2A;
  --ink: #F3F1EC; --ink-soft: #B5B1AA; --ink-faint: #8E8A83; --on-ink: #121110;
  --accent: #FF6A3D; --accent-soft: #3A1E14; --accent-ink: #FF9C7C; --on-accent: #1A0B05;
  --ok: #4CC38A; --ok-soft: #12291D; --warn: #E3A33B; --warn-soft: #2E2412; --danger: #FF6B5E; --danger-soft: #34161A;
  --hero: #262421; --hero-fg: #F3F1EC; --hero-soft: #B5B1AA; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121110; --surface: #1C1B19; --surface-2: #262421; --line: #2F2D2A;
  --ink: #F3F1EC; --ink-soft: #B5B1AA; --ink-faint: #8E8A83; --on-ink: #121110;
  --accent: #FF6A3D; --accent-soft: #3A1E14; --accent-ink: #FF9C7C; --on-accent: #1A0B05;
  --ok: #4CC38A; --ok-soft: #12291D; --warn: #E3A33B; --warn-soft: #2E2412; --danger: #FF6B5E; --danger-soft: #34161A;
  --hero: #262421; --hero-fg: #F3F1EC; --hero-soft: #B5B1AA; --shadow: none; color-scheme: dark; }

html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
p, h1, h2, h3, ul, ol { margin: 0; }
button { font: inherit; color: inherit; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; }

/* type scale */
.h-display { font: 800 40px/1.1 var(--font-display); letter-spacing: -1px; text-wrap: balance; }
.h-title { font: 700 28px/1.2 var(--font-display); letter-spacing: -.5px; text-wrap: balance; }
.h-heading { font: 700 20px/1.3 var(--font-display); letter-spacing: -.2px; }
.body-strong { font-weight: 600; }
.label { font-size: 15px; line-height: 20px; font-weight: 600; }
.caption { font-size: 13px; line-height: 18px; font-weight: 500; }
.overline { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
.soft { color: var(--ink-soft); } .faint { color: var(--ink-faint); } .accent { color: var(--accent); } .accent-ink { color: var(--accent-ink); }
.warn-text { color: var(--warn); } .center { text-align: center; }
.num { font-variant-numeric: tabular-nums; }
.icon-row { display: flex; align-items: center; gap: 6px; }

/* layout */
.screen { min-height: 100%; display: flex; flex-direction: column; }
.content { padding-block: 24px 120px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); flex: 1; }
.stack-xs { display: flex; flex-direction: column; gap: 4px; } .stack-sm { display: flex; flex-direction: column; gap: 8px; }
.stack-md { display: flex; flex-direction: column; gap: 12px; } .stack-lg { display: flex; flex-direction: column; gap: 16px; }
.stack-xl { display: flex; flex-direction: column; gap: 24px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .row-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.row-2 > *, .row-2-1 > *, .row-3 > * { min-width: 0; }
.footer-bar { position: sticky; bottom: 0; display: flex; gap: 12px; background: var(--bg); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.footer-bar.column { flex-direction: column; }
.screen:has(.footer-bar) .content { padding-bottom: 24px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; cursor: pointer;
  font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform .12s ease, opacity .12s ease; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .goal:focus-visible, .item-name:focus-visible, .saved-row:focus-visible, .timer:focus-visible, .tabbar button:focus-visible, .back:focus-visible, .icon-btn:focus-visible, .item-x:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn-lg { height: 56px; padding: 0 24px; font-size: 17px; } .btn-md { height: 46px; padding: 0 16px; font-size: 15px; }
.btn.full { width: 100%; flex: none; }
.footer-bar:not(.column) .btn.full { flex: 1; width: auto; }
.btn-primary { background: var(--ink); color: var(--on-ink); } .btn-accent { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: var(--surface); color: var(--ink); } .btn-ghost { background: transparent; color: var(--ink); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.hero .btn-secondary { background: var(--surface-2); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; display: inline-block; animation: spin .8s linear infinite; vertical-align: -3px; }
.spinner.big { width: 36px; height: 36px; border-width: 3.5px; color: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }

/* chips, fields, banners, cards */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 9px 16px; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.chip-plus { color: var(--ink-faint); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: 15px; font-weight: 600; color: var(--ink-soft); }
.field-box { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; }
.field-box:focus-within { border-color: var(--ink); }
.field-box input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 400 17px var(--font); padding: 14px 0; outline: none; }
.field-suffix { color: var(--ink-faint); font-size: 15px; font-weight: 600; padding-left: 8px; }
.add-plus { color: var(--ink-soft); font-size: 22px; padding-right: 8px; }
.banner { border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 20px; font-weight: 500; }
.banner-info { background: var(--surface); color: var(--ink-soft); } .banner-warn { background: var(--warn-soft); color: var(--warn); }
.banner-danger { background: var(--danger-soft); color: var(--danger); } .banner-ok { background: var(--ok-soft); color: var(--ok); }
.card { background: var(--surface); border-radius: 24px; padding: 18px; }
.card-white { background: var(--bg); border: 1px solid var(--line); }
.card-accent { background: var(--accent-soft); } .card-danger { background: var(--danger-soft); }
.state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 56px 24px; }
.state-icon { font-size: 48px; line-height: 56px; }
.photo { width: 100%; max-width: 100%; height: 220px; object-fit: cover; border-radius: 24px; }
.steps { display: flex; gap: 4px; } .steps span { flex: 1; height: 4px; border-radius: 999px; background: var(--surface-2); } .steps span.on { background: var(--ink); }
.goal { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 24px; padding: 18px; cursor: pointer; }
.goal.on { border: 2px solid var(--ink); padding: 17px; }

/* today bars + hero */
.bar-row { display: flex; flex-direction: column; gap: 8px; }
.bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; flex: 1; }
.bar.thin { height: 6px; }
.bar-fill { height: 100%; border-radius: 999px; transition: width .6s ease; }
.fill-accent { background: var(--accent); } .fill-ink { background: var(--ink); }
.hero { background: var(--hero); color: var(--hero-fg); border-radius: 24px; padding: 24px; }
.hero-title { color: var(--hero-fg); } .hero-soft { color: var(--hero-soft); } .hero-icon { color: var(--accent); }

/* the macro card */
.macro-card { background: var(--bg); border: 1px solid var(--line); border-radius: 32px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { background: var(--surface); color: var(--ink-soft); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
.badge-accent { background: var(--accent); color: var(--on-accent); } .badge-warn { background: var(--warn-soft); color: var(--warn); }
.hero-num { font: 800 68px/1 var(--font-display); letter-spacing: -2px; color: var(--accent); font-variant-numeric: tabular-nums; }
.hero-unit { font-size: 28px; letter-spacing: 0; margin-left: 2px; }
.stat-box { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 16px; background: var(--surface); border-radius: 16px; padding: 16px; }
.stat-divider { background: var(--line); }
.stat-val { font: 700 24px/30px var(--font-display); font-variant-numeric: tabular-nums; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }

/* confirm list */
.items { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); }
.item-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left; background: none; border: 0; padding: 12px 16px; cursor: text; }
.item-edit { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 400 17px var(--font); padding: 14px 16px; outline: none; }
.item-x { background: none; border: 0; color: var(--ink-soft); font-size: 26px; line-height: 1; padding: 12px 18px; cursor: pointer; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare > * { min-width: 0; }
.compare-key { grid-column: 1 / -1; }
.mini { padding-left: 18px; font-size: 14px; line-height: 22px; }
.mini li.only { background: var(--accent-soft); border-radius: 6px; padding: 0 4px; }

/* recipe details */
.ing { list-style: none; padding: 0; display: flex; flex-direction: column; }
.ing li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ing li > :first-child { min-width: 0; }
.steps-list { padding-left: 22px; display: flex; flex-direction: column; gap: 12px; }
.steps-list li::marker { color: var(--accent); font-weight: 700; }

/* saved list + profile */
.saved { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.saved-row { width: 100%; display: flex; align-items: center; gap: 16px; background: var(--surface); border: 0; border-radius: 24px; padding: 16px; text-align: left; cursor: pointer; }
.saved-num { display: flex; flex-direction: column; align-items: center; min-width: 64px; font: 700 26px/30px var(--font-display); }
.saved-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kv { display: flex; justify-content: space-between; gap: 16px; } .kv > :last-child { text-align: right; }

/* chrome */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.back { justify-self: start; background: none; border: 0; font-size: 17px; font-weight: 600; color: var(--ink); padding: 6px 8px; cursor: pointer; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--bg); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar button { flex: 1; max-width: 186px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 8px 4px 10px; font-size: 12px; font-weight: 600; color: var(--ink-faint); cursor: pointer; }
.tabbar button.on { color: var(--ink); }

/* cook mode */
.cook { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
.cook-top { display: flex; align-items: center; gap: 12px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.icon-btn { background: none; border: 0; font-size: 34px; line-height: 1; padding: 4px 10px; cursor: pointer; color: var(--ink); }
.cook-viewport { flex: 1; overflow: hidden; touch-action: pan-y; }
.cook-track { display: flex; height: 100%; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.cook-page { flex: 0 0 100%; min-width: 0; display: flex; flex-direction: column; gap: 24px; padding-block: 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.cook-text { font: 600 30px/1.35 var(--font-display); letter-spacing: -.3px; }
.timer { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; border-radius: 32px; padding: 24px; background: var(--surface); color: var(--ink-soft); cursor: pointer; }
.timer-num { font: 800 64px/1 var(--font-display); letter-spacing: -2px; color: var(--ink); }
.timer.running { background: var(--hero); } .timer.running .timer-num { color: var(--hero-fg); } .timer.running .label { color: var(--hero-soft); }
.timer.done { background: var(--ok-soft); } .timer.done .timer-num, .timer.done .label { color: var(--ok); }

/* motion */
.fade { animation: fade .25s ease both; } .rise { animation: rise .35s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 380px) { .row-3 { grid-template-columns: 1fr 1fr; } .row-3 > :last-child { grid-column: 1 / -1; } .hero-num { font-size: 60px; } }
</style>
<div id="app"></div>
