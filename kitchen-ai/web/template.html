<title>Kitchen AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a full-width welcome page (3D kitchen fixed behind, big type, numbered sections), then a calm phone-width app.
   Warm cream paper, near-black ink, one tomato accent, a sun-coloured glow for light. Grotesque display + italic serif accent. */
:root {
  --bg: #FFF4E6; --paper: #FFFAF3; --surface: #F9E9D6; --surface-2: #F1DDC6; --line: rgba(26,21,18,.10); --line-strong: rgba(26,21,18,.22);
  --ink: #1A1512; --ink-soft: #5E5148; --ink-faint: #8B7B6F; --on-ink: #FFF4E6;
  --accent: #F0421C; --accent-soft: #FFE1D2; --accent-ink: #B32D0C; --on-accent: #FFFFFF; --sun: #FFB23E;
  --ok: #12804A; --ok-soft: #E2F3E6; --warn: #8F5608; --warn-soft: #FFEFCF; --danger: #C42B1F; --danger-soft: #FDE3DD;
  --night: #17110E; --night-2: #241A14; --night-fg: #FFF4E6; --night-soft: #BFAE9E;
  --dish-a: #FFE9D2; --dish-b: #FFF6EA; --dish-bowl: #FFFFFF; --dish-rim: #EBDDCB; --dish-inner: #F6EADB; --dish-shadow: rgba(90,50,10,.12); --dish-steam: rgba(120,95,75,.35);
  --glass: rgba(255,250,243,.74); --card-shadow: 0 30px 60px -34px rgba(90,45,0,.35);
  --display: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --gutter: clamp(18px, 4.5vw, 56px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #120D0A; --paper: #1B1410; --surface: #241A14; --surface-2: #30241C; --line: rgba(255,238,220,.10); --line-strong: rgba(255,238,220,.22);
  --ink: #FBF1E4; --ink-soft: #C6B6A6; --ink-faint: #96877B; --on-ink: #17110E;
  --accent: #FF6337; --accent-soft: #3B1C10; --accent-ink: #FF9B78; --on-accent: #1B0A04; --sun: #FFB23E;
  --ok: #4CC38A; --ok-soft: #12291D; --warn: #E8AA45; --warn-soft: #2F2411; --danger: #FF6B5E; --danger-soft: #36171A;
  --night: #1F1611; --night-2: #2B1F18; --night-fg: #FBF1E4; --night-soft: #BBAA9A;
  --dish-a: #2A1E17; --dish-b: #1D1511; --dish-bowl: #33271F; --dish-rim: #47382D; --dish-inner: #3D2F25; --dish-shadow: rgba(0,0,0,.45); --dish-steam: rgba(255,240,225,.25);
  --glass: rgba(27,20,16,.72); --card-shadow: 0 30px 60px -30px rgba(0,0,0,.7);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #120D0A; --paper: #1B1410; --surface: #241A14; --surface-2: #30241C; --line: rgba(255,238,220,.10); --line-strong: rgba(255,238,220,.22);
  --ink: #FBF1E4; --ink-soft: #C6B6A6; --ink-faint: #96877B; --on-ink: #17110E;
  --accent: #FF6337; --accent-soft: #3B1C10; --accent-ink: #FF9B78; --on-accent: #1B0A04; --sun: #FFB23E;
  --ok: #4CC38A; --ok-soft: #12291D; --warn: #E8AA45; --warn-soft: #2F2411; --danger: #FF6B5E; --danger-soft: #36171A;
  --night: #1F1611; --night-2: #2B1F18; --night-fg: #FBF1E4; --night-soft: #BBAA9A;
  --dish-a: #2A1E17; --dish-b: #1D1511; --dish-bowl: #33271F; --dish-rim: #47382D; --dish-inner: #3D2F25; --dish-shadow: rgba(0,0,0,.45); --dish-steam: rgba(255,240,225,.25);
  --glass: rgba(27,20,16,.72); --card-shadow: 0 30px 60px -30px rgba(0,0,0,.7);
  color-scheme: dark; }

html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--display); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
* { box-sizing: border-box; }
p, h1, h2, h3, ul, ol, dl, dd { margin: 0; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent-ink); }
#app { min-height: 100%; }
h1 em, h2 em, .brand em, .post-title em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent); letter-spacing: -.01em; font-size: 1.08em; }

/* type */
.h-display { font: 800 38px/1.02 var(--display); letter-spacing: -.045em; text-wrap: balance; }
.h-title { font: 750 25px/1.14 var(--display); letter-spacing: -.035em; text-wrap: balance; }
.h-heading { font: 700 18px/1.3 var(--display); letter-spacing: -.02em; }
.body-strong { font-weight: 650; }
.label { font-size: 15px; line-height: 20px; font-weight: 650; }
.caption { font-size: 13px; line-height: 18px; font-weight: 450; }
.overline { font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.soft { color: var(--ink-soft); } .faint { color: var(--ink-faint); } .accent { color: var(--accent); } .accent-ink { color: var(--accent-ink); }
.warn-text { color: var(--warn); } .center { text-align: center; }
.num { font-variant-numeric: tabular-nums; }
.icon-row { display: flex; align-items: center; gap: 6px; }

/* app layout */
.screen { min-height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; }
.content { padding-block: 20px 124px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); flex: 1; }
.stack-xs { display: flex; flex-direction: column; gap: 4px; } .stack-sm { display: flex; flex-direction: column; gap: 8px; }
.stack-md { display: flex; flex-direction: column; gap: 12px; } .stack-lg { display: flex; flex-direction: column; gap: 16px; }
.stack-xl { display: flex; flex-direction: column; gap: 28px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .row-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.row-3 { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; }
.row-2 > *, .row-2-1 > *, .row-3 > * { min-width: 0; }
.page-head { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.footer-bar { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 10px; background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.footer-bar.column { flex-direction: column; }
.screen:has(.footer-bar) .content { padding-bottom: 28px; }

/* buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; cursor: pointer;
  font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .35; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .goal:focus-visible, .item-name:focus-visible, .saved-row:focus-visible, .timer:focus-visible, .tabbar button:focus-visible, .back:focus-visible, .icon-btn:focus-visible,
.item-x:focus-visible, .post-main:focus-visible, .act:focus-visible, .follow:focus-visible, .more:focus-visible, .import-card:focus-visible, .seg button:focus-visible, .lp-links button:focus-visible, .lp-dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-lg { height: 56px; padding: 0 26px; font-size: 16px; } .btn-md { height: 44px; padding: 0 18px; font-size: 14px; }
.btn.full { width: 100%; flex: none; }
.footer-bar:not(.column) .btn.full { flex: 1; width: auto; }
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-accent { background: var(--accent); color: var(--on-accent); box-shadow: 0 14px 30px -12px color-mix(in srgb, var(--accent) 75%, transparent); }
.btn-secondary { background: var(--surface); color: var(--ink); } .btn-ghost { background: transparent; color: var(--ink-soft); }
.btn-outline { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.shine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%); transform: translateX(-120%); animation: shine 3.6s var(--ease) infinite; }
@keyframes shine { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; display: inline-block; animation: spin .8s linear infinite; vertical-align: -3px; }
.spinner.big { width: 32px; height: 32px; color: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }

/* chips, fields, banners, cards */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll-x { flex-wrap: nowrap; overflow-x: auto; margin-inline: -20px; padding-inline: 20px; scrollbar-width: none; } .chips.scroll-x::-webkit-scrollbar { display: none; } .chips.scroll-x .chip { flex: none; }
.chip { border: 1px solid var(--line-strong); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; transition: background .2s, color .2s; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.chip-plus { color: var(--ink-faint); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 13px; font-weight: 650; color: var(--ink-soft); }
.field-box { display: flex; align-items: center; background: var(--paper); border: 1px solid var(--line-strong); border-radius: 16px; padding: 0 16px; transition: border-color .2s, box-shadow .2s; }
.field-box:focus-within, .textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sun) 28%, transparent); }
.field-box input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 400 16px var(--display); padding: 14px 0; outline: none; }
.field-suffix { color: var(--ink-faint); font-size: 14px; font-weight: 600; padding-left: 8px; }
.textarea { width: 100%; background: var(--paper); border: 1px solid var(--line-strong); border-radius: 16px; padding: 14px 16px; color: var(--ink); font: 400 16px/1.5 var(--display); outline: none; resize: vertical; min-height: 150px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; } .check input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); margin: 0; }
.add-plus { color: var(--ink-faint); font-size: 20px; padding-right: 8px; }
.banner { border-radius: 16px; padding: 12px 14px; font-size: 14px; line-height: 20px; font-weight: 500; }
.banner-info { background: var(--surface); color: var(--ink-soft); } .banner-warn { background: var(--warn-soft); color: var(--warn); }
.banner-danger { background: var(--danger-soft); color: var(--danger); } .banner-ok { background: var(--ok-soft); color: var(--ok); }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 18px; }
.card-white { background: var(--paper); }
.card-accent { background: var(--accent-soft); border-color: transparent; } .card-danger { background: var(--danger-soft); border-color: transparent; }
.state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 48px 24px; }
.state-icon { font-size: 44px; line-height: 52px; }
.photo { display: block; width: 100%; max-width: 100%; height: 240px; object-fit: cover; border-radius: 24px; }
.scan-photo { position: relative; border-radius: 24px; overflow: hidden; box-shadow: var(--card-shadow); }
.scan-line { position: absolute; left: 0; right: 0; height: 90px; top: -90px; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--sun) 55%, transparent) 70%, #fff); mix-blend-mode: screen; animation: scan 1.9s var(--ease) infinite; }
@keyframes scan { to { top: 100%; } }
.steps { display: flex; gap: 4px; } .steps span { flex: 1; height: 3px; border-radius: 999px; background: var(--surface-2); transition: background .3s; } .steps span.on { background: var(--accent); }
.goal { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--paper); border: 1px solid var(--line-strong); border-radius: 22px; padding: 16px 18px; cursor: pointer; transition: border-color .2s, box-shadow .2s, transform .2s var(--ease); }
.goal:hover { transform: translateY(-1px); }
.goal.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink), 0 0 0 5px color-mix(in srgb, var(--sun) 26%, transparent); }

/* brand + home */
.home-head { display: flex; justify-content: space-between; align-items: center; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 750; letter-spacing: -.03em; }
.brand em { font-size: 1.15em; }
.brand-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent), 0 0 18px var(--accent); }
.today { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.today-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 16px; }
.today-num { font: 800 36px/1 var(--display); letter-spacing: -.05em; }
.today-col:first-child .today-num { color: var(--accent); text-shadow: 0 0 34px color-mix(in srgb, var(--accent) 40%, transparent); }
.today-unit { font-size: 16px; font-weight: 650; letter-spacing: 0; margin-left: 2px; color: var(--ink-soft); text-shadow: none; }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; flex: 1; }
.bar.thin { height: 5px; flex: none; }
.bar-fill { height: 100%; border-radius: 999px; transition: width .8s var(--ease); }
.fill-accent { background: linear-gradient(90deg, var(--sun), var(--accent)); } .fill-ink { background: var(--ink); }
.hero { position: relative; isolation: isolate; overflow: hidden; border-radius: 32px; padding: 22px; color: var(--night-fg); display: flex; flex-direction: column; gap: 14px; box-shadow: var(--card-shadow);
  background: radial-gradient(360px circle at var(--lx, 78%) var(--ly, 18%), rgba(255,150,70,.38), transparent 62%), radial-gradient(520px circle at 0% 100%, rgba(240,66,28,.22), transparent 60%), var(--night); }
.hero-3d { height: 210px; margin: -14px -22px -18px; }
.orbit3d { position: relative; touch-action: pan-y; } .orbit3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .8s; } .orbit3d canvas.is-ready { opacity: 1; }
.loader-3d { height: 220px; margin-bottom: -30px; }
.hero-title { color: var(--night-fg); font-size: 30px; } .hero-title em { color: var(--sun); }
.hero-soft { color: var(--night-soft); font-size: 15px; line-height: 21px; }
.hero-copy { display: flex; flex-direction: column; gap: 6px; }
.hero .btn-secondary { background: rgba(255,244,230,.1); color: var(--night-fg); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: inset 0 0 0 1px rgba(255,244,230,.14); }
.import-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 16px; cursor: pointer; transition: transform .2s var(--ease), box-shadow .2s; }
.import-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow); }
.import-icon { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
.import-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* dish illustrations */
.dish svg { display: block; width: 100%; height: auto; overflow: visible; }
.dish-panel { position: relative; padding: 14px 24px 6px; background: radial-gradient(60% 70% at 50% 45%, color-mix(in srgb, var(--sun) 30%, transparent), transparent 70%), linear-gradient(160deg, var(--dish-a), var(--dish-b)); }
.dish-panel .dish { max-width: 300px; margin: 0 auto; }
.dish-panel .badges { position: absolute; top: 14px; left: 16px; right: 16px; }
.dish-thumb { width: 64px; flex: none; } .done-dish { width: 220px; }
.dish-bob { animation: dish-bob 5s ease-in-out infinite; }
.dish-turn { transform-box: view-box; animation: dish-turn 80s linear infinite; }
.dish-piece { transform-box: fill-box; transform-origin: center; animation: dish-pop .5s cubic-bezier(.3,1.4,.5,1) both; }
.dish-steam { animation: dish-steam 3.2s ease-in-out infinite both; opacity: 0; }
@keyframes dish-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes dish-turn { to { transform: rotate(360deg); } }
@keyframes dish-pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes dish-steam { 0% { transform: translateY(8px); opacity: 0; } 35% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }

/* the macro card */
.macro-card { background: var(--paper); border: 1px solid var(--line); border-radius: 30px; overflow: hidden; box-shadow: var(--card-shadow); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--ink-soft); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
.badge-accent { background: var(--accent); color: var(--on-accent); } .badge-warn { background: var(--warn-soft); color: var(--warn); }
.mc-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
.hero-num { font: 800 66px/.95 var(--display); letter-spacing: -.06em; color: var(--accent); font-variant-numeric: tabular-nums; text-shadow: 0 0 44px color-mix(in srgb, var(--accent) 38%, transparent); }
.hero-unit { font: italic 400 24px/1 var(--serif); letter-spacing: 0; margin-left: 8px; color: var(--ink-soft); text-shadow: none; }
.mc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.mc-stats > div { min-width: 0; }
.mc-stats dt { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
.mc-stats dd { font: 700 18px/1.3 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fit { color: var(--ink); font-weight: 700; margin-right: 6px; }

/* confirm list */
.items { list-style: none; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.item-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; text-align: left; background: none; border: 0; padding: 13px 0; cursor: text; }
.item-edit { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 400 16px var(--display); padding: 14px 0; outline: none; }
.item-x { background: none; border: 0; color: var(--ink-faint); font-size: 24px; line-height: 1; padding: 10px 4px 10px 16px; cursor: pointer; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .compare > * { min-width: 0; } .compare-key { grid-column: 1 / -1; }
.mini { padding-left: 18px; font-size: 14px; line-height: 22px; } .mini li.only { background: var(--accent-soft); border-radius: 6px; padding: 0 4px; }

/* recipe details */
.ing { list-style: none; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.ing li { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.ing li > :first-child { min-width: 0; }
.steps-list { padding-left: 24px; display: flex; flex-direction: column; gap: 14px; }
.steps-list li { padding-left: 4px; } .steps-list li::marker { color: var(--accent); font: italic 400 20px var(--serif); }
.credit a { font-weight: 600; }

/* saved list + profile */
.saved { list-style: none; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.saved-row { width: 100%; display: flex; align-items: center; gap: 14px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; text-align: left; cursor: pointer; }
.saved-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.chev { font-size: 22px; }
.kv { display: flex; justify-content: space-between; gap: 16px; } .kv > :last-child { text-align: right; }

/* community */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 999px; padding: 4px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 9px; font-size: 14px; font-weight: 650; color: var(--ink-soft); cursor: pointer; transition: background .2s, color .2s; }
.seg button.on { background: var(--paper); color: var(--ink); box-shadow: 0 2px 8px -2px rgba(60,30,0,.25); }
.feed { display: flex; flex-direction: column; gap: 18px; }
.post { background: var(--paper); border: 1px solid var(--line); border-radius: 30px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
